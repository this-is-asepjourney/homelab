[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = true
  logfile = ""
  logtarget = "stderr"

# ──────────────────────────────────────────────────────
# OUTPUT: Prometheus Client (scrape endpoint on :9273)
# ──────────────────────────────────────────────────────
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  string_as_label = false
  expiration_interval = "5m"

# ──────────────────────────────────────────────────────
# PROCESSOR: Standardize MAC Address & Model Tags
# ──────────────────────────────────────────────────────
[[processors.rename]]
  [[processors.rename.replace]]
    tag = "IOT_MAC"
    dest = "MAC"
  [[processors.rename.replace]]
    tag = "mac"
    dest = "MAC"
  [[processors.rename.replace]]
    tag = "IOT_MODEL"
    dest = "model"
  [[processors.rename.replace]]
    tag = "serial"
    dest = "MCID"

# ──────────────────────────────────────────────────────
# PROCESSOR: Convert STS (ON/OFF) -> Integer for Prometheus
# ──────────────────────────────────────────────────────
[[processors.enum]]
  [[processors.enum.mapping]]
    field = "STS"
    [processors.enum.mapping.value_mappings]
      ON = 1
      OFF = 0

# ──────────────────────────────────────────────────────
# INPUT: MQTT Consumer for SysCtrl & Eternal IoT Telemetry
# ──────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER_HOST:-mosquitto}:${MQTT_BROKER_PORT:-1883}"]
  topics = [
    "+/SysCtrl",
    "/SysCtrl",
    "SysCtrl",
    "Eternal/SysCtrl",
    "/Eternal/telemetry",
    "Eternal/telemetry",
    "/Eternal/rfid",
    "/Eternal/lock",
    "/Eternal/#",
    "Eternal/#",
    "eternal/#",
    "eternal/telemetry",
    "/eternal/telemetry",
    "+/Event/Cnt",
    "+/Event/Handling",
    "+/Event/Mchn_time",
    "+/Heatpress"
  ]
  username = "${MQTT_USERNAME:-useriot}"
  password = "${MQTT_PASSWORD:-25022002}"
  data_format = "json"
  name_override = "sysctrl"
  connection_timeout = "30s"
  json_string_fields = [
    "MAC", "IOT_MAC", "MCID", "IOT_MODEL", "AP_MAC",
    "IOT_SPPL_CD", "MCIP", "STS", "VER",
    "mac", "model", "mcid", "sts", "ver",
    "device", "serial", "seri", "nama", "ip", "ssid", "lock_state", "lock_status",
    "last_nfc_uid", "last_nfc_user", "uid", "name", "role", "action", "trigger",
    "last_rfid_uid", "last_rfid_name", "active_user", "active_username", "active_role", "active_uid"
  ]
  tag_keys = [
    "MAC", "IOT_MAC", "MCID", "mac", "mcid", "model", "IOT_MODEL",
    "device", "serial", "seri", "nama", "lock_status", "role", "action"
  ]
