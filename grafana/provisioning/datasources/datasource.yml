apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    editable: true

  - name: PostgreSQL-EternalIoT
    type: postgres
    access: proxy
    orgId: 1
    url: postgres:5432
    uid: postgres-iot-db
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    database: eternal_iot
    isDefault: false
    jsonData:
      database: eternal_iot
      sslmode: 'disable'
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    editable: true

  - name: MySQL-Homelab
    type: mysql
    access: proxy
    orgId: 1
    url: mysql:3306
    uid: mysql-iot-db
    user: ${MYSQL_USER}
    secureJsonData:
      password: ${MYSQL_PASSWORD}
    database: ${MYSQL_DATABASE}
    isDefault: false
    jsonData:
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: true
