name: homelab

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # =============================================================================
  # CORE DATABASES
  # =============================================================================
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--innodb-buffer-pool-size=192M"
      - "--performance-schema=OFF"
      - "--max-connections=100"
      - "--table-open-cache=400"
      - "--host-cache-size=0"
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ganti_root_password_mysql}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fadb}
      MYSQL_USER: ${MYSQL_USER:-fadb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wokeh123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-ganti_root_password_mysql}"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 120s
    networks:
      - homelab

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    logging: *default-logging
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=32MB"
      - "-c"
      - "max_connections=100"
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      POSTGRES_USER: ${POSTGRES_USER:-fadb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wokeh123}
      POSTGRES_DB: ${POSTGRES_DB:-fadb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fadb} -d ${POSTGRES_DB:-fadb}"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 90s
    networks:
      - homelab

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "60", "100"]
    volumes:
      - redis_data:/data
    networks:
      - homelab

  # =============================================================================
  # OBJECT STORAGE (MINIO / SILO S3)
  # =============================================================================
  minio:
    image: pgsty/silo:latest
    container_name: minio
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin12345}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || wget -qO- http://127.0.0.1:9000/minio/health/live || mc ready local || mcli ready local"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 90s
    networks:
      homelab:
        aliases:
          - silo
          - homelab_minio

  minio-init:
    image: pgsty/mc:latest
    container_name: minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin12345}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        MC=$$(command -v mc || command -v mcli || true)
        if [ -z "$$MC" ]; then
          echo "ERROR: neither mc nor mcli binary found in pgsty/mc"
          exit 1
        fi
        i=0
        until $$MC alias set myminio http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          i=$$((i + 1))
          if [ "$$i" -ge 15 ]; then
            echo "ERROR: failed to connect to minio after 15 attempts"
            exit 1
          fi
          sleep 2
        done
        for bucket in images stock-umkm homelab-storage backups; do
          $$MC mb --ignore-existing "myminio/$$bucket"
        done
        for pub_bucket in images stock-umkm homelab-storage; do
          $$MC anonymous set download "myminio/$$pub_bucket"
        done
        echo "MinIO default buckets initialized: images, stock-umkm, homelab-storage (public download), backups (private)."
    networks:
      - homelab

  # =============================================================================
  # APPLICATIONS
  # =============================================================================
  nextcloud:
    image: nextcloud:stable
    container_name: nextcloud
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-fadb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wokeh123}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-fadb}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-wokeh123}
      NEXTCLOUD_TRUSTED_DOMAINS: "${SERVER_LAN_IP:-192.168.25.105} ${SERVER_TS_IP:-100.78.113.53} nextcloud.homelab localhost 127.0.0.1"
      REDIS_HOST: redis
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 2G
    ports:
      - "8080:80"
    volumes:
      - nextcloud_data:/var/www/html
    networks:
      - homelab

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - homelab

  telegraf:
    image: telegraf:1.29
    container_name: telegraf
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9273:9273"
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - MQTT_USERNAME=${MQTT_USER:-useriot}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-25022002}
    networks:
      - homelab
    depends_on:
      - mosquitto

  # =============================================================================
  # OBSERVABILITY & MONITORING
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=2GB"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - homelab

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    logging: *default-logging
    pid: host
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    networks:
      - homelab

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    logging: *default-logging
    privileged: true
    command:
      - "--housekeeping_interval=30s"
      - "--max_housekeeping_interval=35s"
      - "--docker_only=true"
      - "--store_container_labels=false"
      - "--disable_metrics=percpu,sched,hugetlb,referenced_memory,cpu_topology,resctrl"
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - homelab

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - prometheus
      - postgres
      - mysql
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-fadb}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-wokeh123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_USER: ${POSTGRES_USER:-fadb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wokeh123}
      MYSQL_USER: ${MYSQL_USER:-fadb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wokeh123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fadb}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - homelab

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - homelab

  # =============================================================================
  # PERSONAL CLOUD MANAGEMENT PLATFORM (PAP & PSM)
  # =============================================================================
  pap-api:
    build:
      context: .
      dockerfile: Personal_Api_Platform/docker/Dockerfile
    container_name: pap-api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      HOST_IP: 0.0.0.0
      SERVER_LAN_IP: ${SERVER_LAN_IP:-192.168.25.105}
      SERVER_TS_IP: ${SERVER_TS_IP:-100.78.113.53}
      PORT: 8000
      PAP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fadb}:${POSTGRES_PASSWORD:-wokeh123}@postgres:5432/pap_core
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-fadb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wokeh123}
      IOT_POSTGRES_DB: eternal_iot
      NEXTCLOUD_DB_NAME: ${NEXTCLOUD_DB_NAME:-nextcloud}
      ENABLE_MQTT_CONSUMER: "true"
      SKIP_PSM_DB_INIT: "true"
      BACKUP_STORAGE_DIR: /opt/psm/pap_backups
      PSM_DATABASE_HOST: postgres
      PSM_DATABASE_PORT: 5432
      PSM_DATABASE_NAME: psm
      PSM_DATABASE_USER: ${POSTGRES_USER:-fadb}
      PSM_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-wokeh123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-fadb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wokeh123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ganti_root_password_mysql}
      STOCK_DB_HOST: mysql
      STOCK_DB_PORT: 3306
      STOCK_DB_NAME: ${MYSQL_DATABASE:-fadb}
      STOCK_DB_USER: ${MYSQL_USER:-fadb}
      STOCK_DB_PASSWORD: ${MYSQL_PASSWORD:-wokeh123}
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_URL: http://minio:9000
      MINIO_PUBLIC_URL: http://${SERVER_LAN_IP:-192.168.25.105}:9000
      MINIO_CONSOLE_URL: http://${SERVER_LAN_IP:-192.168.25.105}:9002
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin12345}
      MINIO_BACKUP_BUCKET: backups
      PROMETHEUS_URL: http://prometheus:9090
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USER:-useriot}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-25022002}
      PSM_API_URL: http://psm-api:8000
      PAP_PSM_SERVICE_KEY: ${PAP_PSM_SERVICE_KEY:-pap_key_psm_control_plane_default_secret_key_2026}
      JWT_SECRET: ${JWT_SECRET:-super_secret_pap_jwt_signing_key_production_2026_homelab_core}
      CORS_ORIGINS: "http://homelab,http://api.homelab,http://psm.homelab,http://psm-api.homelab,http://minio.homelab,http://s3.homelab,http://${SERVER_LAN_IP:-192.168.25.105}:3000,http://${SERVER_LAN_IP:-192.168.25.105}:3001,http://${SERVER_LAN_IP:-192.168.25.105}:3005,http://${SERVER_LAN_IP:-192.168.25.105}:8000,http://${SERVER_LAN_IP:-192.168.25.105}:8001,http://${SERVER_LAN_IP:-192.168.25.105}:8080,http://${SERVER_LAN_IP:-192.168.25.105}:8081,http://${SERVER_LAN_IP:-192.168.25.105}:9000,http://${SERVER_LAN_IP:-192.168.25.105}:9002,http://${SERVER_TS_IP:-100.78.113.53}:3000,http://${SERVER_TS_IP:-100.78.113.53}:3001,http://${SERVER_TS_IP:-100.78.113.53}:3005,http://${SERVER_TS_IP:-100.78.113.53}:8000,http://${SERVER_TS_IP:-100.78.113.53}:8001,http://${SERVER_TS_IP:-100.78.113.53}:8080,http://${SERVER_TS_IP:-100.78.113.53}:8081,http://${SERVER_TS_IP:-100.78.113.53}:9000,http://${SERVER_TS_IP:-100.78.113.53}:9002,http://localhost:3000,http://localhost:3005,http://localhost:8000,http://localhost:8001,http://localhost:9000,http://localhost:9002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./router:/app/router
      - ./dns:/app/dns
      - ./prometheus:/app/prometheus:ro
      - ./mosquitto:/app/mosquitto:ro
      - ./telegraf:/app/telegraf:ro
      - ./grafana/provisioning:/app/grafana/provisioning:ro
      - ./docker-compose.yml:/app/homelab-compose.yml:ro
      - psm_storage:/opt/psm
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 120s
    networks:
      - homelab

  psm-api:
    build:
      context: ./Personal_Server_Manager
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: psm-api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      METRICS_RETENTION_HOURS: "48"
      HEARTBEAT_TIMEOUT_SECONDS: "90"
      SERVER_LAN_IP: ${SERVER_LAN_IP:-192.168.25.105}
      SERVER_TS_IP: ${SERVER_TS_IP:-100.78.113.53}
      POSTGRES_DB: psm
      POSTGRES_USER: ${POSTGRES_USER:-fadb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wokeh123}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-fadb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wokeh123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wokeh123}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fadb}:${POSTGRES_PASSWORD:-wokeh123}@postgres:5432/psm
      STORAGE_BASE_DIR: /opt/psm
      UPLOAD_DIR: /opt/psm/uploads
      RELEASE_DIR: /opt/psm/releases
      SECRET_KEY: ${PSM_SECRET_KEY:-b8f36a89270df8417727e025170d1fa78f5f4d8520857ef51fa930f785b96a4e}
      ENCRYPTION_MASTER_KEY: ${PSM_ENCRYPTION_MASTER_KEY:-dGhpcy1pcy1hLXNhbXBsZS1mZXJuZXQta2V5LTMyeS0=}
      HOMELAB_AGENT_TOKEN: ${HOMELAB_AGENT_TOKEN:-psm_agent_homelab_default_token}
      PROMETHEUS_URL: http://prometheus:9090
      PAP_API_URL: http://pap-api:8000
      PAP_API_KEY: ${PAP_PSM_SERVICE_KEY:-pap_key_psm_control_plane_default_secret_key_2026}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/class/net:/host/sys/class/net:ro
      - psm_storage:/opt/psm
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 120s
    networks:
      homelab:
        # psm-web image bakes INTERNAL_API_URL=http://api:8000 into Next.js rewrites at build time
        aliases:
          - api

  psm-agent:
    build:
      context: ./Personal_Server_Manager
      dockerfile: infrastructure/docker/Dockerfile.agent
    container_name: psm-agent
    restart: unless-stopped
    logging: *default-logging
    pid: host
    environment:
      SERVER_ID: homelab-primary
      AGENT_TOKEN: ${HOMELAB_AGENT_TOKEN:-psm_agent_homelab_default_token}
      CONTROL_PLANE_URL: http://psm-api:8000
      PSM_BASE_DIR: /opt/psm
      HOST_PROC_NET_DIR: /proc/1/net
      HOST_SYS_NET_DIR: /host/sys/class/net
      HEARTBEAT_INTERVAL: "15"
      METRICS_INTERVAL: "5"
      CONTAINER_STATS_TTL: "30"
      INVENTORY_INTERVAL: "60"
      PSM_BUILD_NICE: "15"
      PSM_BUILD_IONICE_CLASS: "2"
      PSM_BUILD_IONICE_LEVEL: "7"
      PSM_NODE_MAX_OLD_SPACE_MB: "1536"
      PSM_APP_MEMORY_LIMIT: ""
      PSM_APP_MEMORY_SWAP: ""
      PSM_APP_CPUS: ""
      PSM_MAX_KEPT_RELEASES: "3"
      POSTGRES_DB: psm
      POSTGRES_USER: ${POSTGRES_USER:-fadb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wokeh123}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-fadb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wokeh123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wokeh123}
      HOST_IP: ${SERVER_LAN_IP:-192.168.25.105}
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin12345}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/class/net:/host/sys/class/net:ro
      - psm_storage:/opt/psm
    depends_on:
      psm-api:
        condition: service_started
    networks:
      - homelab

  psm-web:
    build:
      context: ./Personal_Server_Manager
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        INTERNAL_API_URL: http://psm-api:8000
    container_name: psm-web
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3005:3005"
    environment:
      SERVER_LAN_IP: ${SERVER_LAN_IP:-192.168.25.105}
      SERVER_TS_IP: ${SERVER_TS_IP:-100.78.113.53}
      INTERNAL_API_URL: http://psm-api:8000
      NEXT_PUBLIC_API_URL: http://${SERVER_LAN_IP:-192.168.25.105}:8001
      NEXT_PUBLIC_WS_URL: ws://${SERVER_LAN_IP:-192.168.25.105}:8001
    depends_on:
      psm-api:
        condition: service_started
    networks:
      - homelab

  # =============================================================================
  # INGRESS ROUTER (PORT 80) & LOCAL DNS (PORT 53)
  # =============================================================================
  homelab-router:
    image: nginx:alpine
    container_name: homelab_router
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./router/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./router/conf.d:/etc/nginx/conf.d:ro
      - ./router/entrypoint.sh:/usr/local/bin/router-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /usr/local/bin/router-entrypoint.sh > /tmp/ep.sh && exec /bin/sh /tmp/ep.sh"]
    networks:
      - homelab

  homelab-dns:
    image: coredns/coredns:latest
    container_name: homelab_dns
    restart: unless-stopped
    logging: *default-logging
    command: -conf /etc/coredns/Corefile
    environment:
      SERVER_LAN_IP: ${SERVER_LAN_IP:-192.168.25.105}
      SERVER_TS_IP: ${SERVER_TS_IP:-100.78.113.53}
    ports:
      - "${SERVER_LAN_IP:-192.168.25.105}:53:53/udp"
      - "${SERVER_LAN_IP:-192.168.25.105}:53:53/tcp"
    volumes:
      - ./dns:/etc/coredns:ro
    networks:
      - homelab

# =============================================================================
# PERSISTENT VOLUMES & SHARED NETWORKS
# =============================================================================
volumes:
  mysql_data:
  postgres_data:
  redis_data:
  minio_data:
  nextcloud_data:
  prometheus_data:
  grafana_data:
  uptime_kuma_data:
  mosquitto_data:
  psm_storage:

networks:
  homelab:
    name: homelab
    driver: bridge
