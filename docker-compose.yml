name: homelab

services:
  # =============================================================================
  # CORE DATABASES
  # =============================================================================
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ganti_root_password_mysql}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fadb}
      MYSQL_USER: ${MYSQL_USER:-fadb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wokeh123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-ganti_root_password_mysql}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - homelab

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      POSTGRES_USER: ${POSTGRES_USER:-fadb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wokeh123}
      POSTGRES_DB: ${POSTGRES_DB:-fadb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fadb} -d ${POSTGRES_DB:-fadb}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - homelab

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - homelab

  # =============================================================================
  # APPLICATIONS
  # =============================================================================
  nextcloud:
    image: nextcloud:stable
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-fadb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wokeh123}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-fadb}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-wokeh123}
      NEXTCLOUD_TRUSTED_DOMAINS: "${SERVER_LAN_IP:-192.168.25.105} ${SERVER_TS_IP:-100.78.113.53} localhost 127.0.0.1"
      REDIS_HOST: redis
      PHP_MEMORY_LIMIT: 1G
      PHP_UPLOAD_LIMIT: 2G
    ports:
      - "8080:80"
    volumes:
      - nextcloud_data:/var/www/html
    networks:
      - homelab

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - homelab

  # =============================================================================
  # OBSERVABILITY & MONITORING
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - homelab

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    networks:
      - homelab

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - homelab

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-fadb}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-wokeh123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - homelab

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - homelab

  # =============================================================================
  # PERSONAL CLOUD MANAGEMENT PLATFORM (PAP & PSM)
  # =============================================================================
  pap-api:
    build:
      context: ./"Personal Api Platform"
      dockerfile: docker/Dockerfile
    container_name: pap-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      HOST_IP: 0.0.0.0
      PORT: 8000
      PAP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fadb}:${POSTGRES_PASSWORD:-wokeh123}@postgres:5432/pap_core
      PSM_DATABASE_HOST: postgres
      PSM_DATABASE_PORT: 5432
      PSM_DATABASE_NAME: psm
      PSM_DATABASE_USER: ${POSTGRES_USER:-fadb}
      PSM_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-wokeh123}
      STOCK_DB_HOST: mysql
      STOCK_DB_PORT: 3306
      STOCK_DB_NAME: ${MYSQL_DATABASE:-fadb}
      STOCK_DB_USER: ${MYSQL_USER:-fadb}
      STOCK_DB_PASSWORD: ${MYSQL_PASSWORD:-wokeh123}
      PROMETHEUS_URL: http://prometheus:9090
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      PSM_API_URL: http://psm-api:8000
      JWT_SECRET: ${JWT_SECRET:-super_secret_pap_jwt_signing_key_production_2026_homelab_core}
      CORS_ORIGINS: "http://${SERVER_LAN_IP:-192.168.25.105}:3000,http://${SERVER_LAN_IP:-192.168.25.105}:3001,http://${SERVER_LAN_IP:-192.168.25.105}:3005,http://${SERVER_LAN_IP:-192.168.25.105}:8000,http://${SERVER_LAN_IP:-192.168.25.105}:8001,http://${SERVER_LAN_IP:-192.168.25.105}:8080,http://${SERVER_LAN_IP:-192.168.25.105}:8081,http://${SERVER_TS_IP:-100.78.113.53}:3000,http://${SERVER_TS_IP:-100.78.113.53}:3001,http://${SERVER_TS_IP:-100.78.113.53}:3005,http://${SERVER_TS_IP:-100.78.113.53}:8000,http://${SERVER_TS_IP:-100.78.113.53}:8001,http://${SERVER_TS_IP:-100.78.113.53}:8080,http://${SERVER_TS_IP:-100.78.113.53}:8081,http://localhost:3000,http://localhost:3005,http://localhost:8000,http://localhost:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - homelab

  psm-api:
    build:
      context: ./Personal_Server_Manager
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: psm-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_DB: psm
      POSTGRES_USER: ${POSTGRES_USER:-fadb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wokeh123}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fadb}:${POSTGRES_PASSWORD:-wokeh123}@postgres:5432/psm
      STORAGE_BASE_DIR: /opt/psm
      UPLOAD_DIR: /opt/psm/uploads
      RELEASE_DIR: /opt/psm/releases
      SECRET_KEY: ${PSM_SECRET_KEY:-b8f36a89270df8417727e025170d1fa78f5f4d8520857ef51fa930f785b96a4e}
      ENCRYPTION_MASTER_KEY: ${PSM_ENCRYPTION_MASTER_KEY:-dGhpcy1pcy1hLXNhbXBsZS1mZXJuZXQta2V5LTMyeS0=}
      HOMELAB_AGENT_TOKEN: ${HOMELAB_AGENT_TOKEN:-psm_agent_homelab_default_token}
      PROMETHEUS_URL: http://prometheus:9090
      PAP_API_URL: http://pap-api:8000
      PAP_API_KEY: ${PAP_PSM_SERVICE_KEY:-pap_key_psm_control_plane_default_secret_key_2026}
    volumes:
      - psm_storage:/opt/psm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - homelab

  psm-agent:
    build:
      context: ./Personal_Server_Manager
      dockerfile: infrastructure/docker/Dockerfile.agent
    container_name: psm-agent
    restart: unless-stopped
    environment:
      SERVER_ID: homelab-primary
      AGENT_TOKEN: ${HOMELAB_AGENT_TOKEN:-psm_agent_homelab_default_token}
      CONTROL_PLANE_URL: http://psm-api:8000
      PSM_BASE_DIR: /opt/psm
      POSTGRES_DB: psm
      POSTGRES_USER: ${POSTGRES_USER:-fadb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wokeh123}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - psm_storage:/opt/psm
    depends_on:
      psm-api:
        condition: service_healthy
    networks:
      - homelab

  psm-web:
    build:
      context: ./Personal_Server_Manager
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: psm-web
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      INTERNAL_API_URL: http://psm-api:8000
      NEXT_PUBLIC_API_URL: http://${SERVER_LAN_IP:-192.168.25.105}:8001
      NEXT_PUBLIC_WS_URL: ws://${SERVER_LAN_IP:-192.168.25.105}:8001
    depends_on:
      psm-api:
        condition: service_healthy
    networks:
      - homelab

# =============================================================================
# PERSISTENT VOLUMES & SHARED NETWORKS
# =============================================================================
volumes:
  mysql_data:
  postgres_data:
  redis_data:
  nextcloud_data:
  prometheus_data:
  grafana_data:
  uptime_kuma_data:
  mosquitto_data:
  psm_storage:

networks:
  homelab:
    name: homelab
    driver: bridge
